<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account | KABAMAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/logo.jpg?v=circle" type="image/jpeg" />
</head>
<body class="customer">
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark"><img src="assets/logo.jpg?v=circle" alt="KABAMAN" /></span>
        <strong>KABAMAN</strong>
      </a>
      <a class="account-link" href="index.html">Customer page</a>
    </div>
  </header>
  <main>
    <section id="account-gate" class="account-board">
      <p class="eyebrow">Account</p>
      <h1>Log in</h1>
      <p class="search-hint">Create an account or log in to see your orders.</p>
      <form id="auth-form" class="link-order">
        <label for="auth-email">Email
          <input id="auth-email" type="email" autocomplete="username" required />
        </label>
        <label for="auth-password">Password
          <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required />
        </label>
        <div id="auth-register-fields" hidden>
          <label for="auth-name">Name
            <input id="auth-name" type="text" maxlength="100" autocomplete="name" />
          </label>
          <label for="auth-phone">Phone
            <input id="auth-phone" type="tel" maxlength="40" autocomplete="tel" />
          </label>
        </div>
        <p id="auth-note" class="form-note" role="alert"></p>
        <button class="btn btn-gold" id="auth-submit" type="submit">Log in</button>
        <button class="btn btn-gold" id="auth-switch" type="button">Create an account</button>
      </form>
    </section>
    <section id="account-board" class="account-board" hidden>
      <p class="eyebrow">Account</p>
      <h1 id="account-heading">Your orders</h1>
      <p id="profile-email"></p>
      <form id="profile-form" class="link-order">
        <label for="profile-name">Name
          <input id="profile-name" type="text" maxlength="100" required />
        </label>
        <label for="profile-phone">Phone
          <input id="profile-phone" type="tel" maxlength="40" />
        </label>
        <p id="profile-note" class="form-note" role="status"></p>
        <button class="btn btn-gold" type="submit">Save profile</button>
      </form>
      <div id="account-orders"></div>
      <button class="btn btn-gold" id="account-logout" type="button">Log out</button>
    </section>
  </main>
  <footer class="footer">
    <p class="slogan">LA QUALITÉ PRIORITÉ</p>
  </footer>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
</body>
</html>
